<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz SQA</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
    #app { max-width: 700px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
    h1, h2, h3 { text-align: center; }
    button { margin: 10px 5px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
    .option { display: block; margin: 10px 0; }
    .correct { background-color: #c8e6c9; }
    .incorrect { background-color: #ffcdd2; }
    #card-choices { display: none; margin-top: 20px; text-align: center; }
    .card-btn { margin: 5px; padding: 0; border: none; background: none; cursor: pointer; }
    .card-img { width: 80px; height: auto; }
#question-container {
    display:block;
    padding:20px;
    margin:20px 0;
    border:2px solid #333;
    background:white;
}
  </style>
</head>
<body>
  <div id="app">
    <h1>DESAFIO DO CONHECIMENTO</h1>
    <div id="start-screen">
      <h2>Escolha a equipe e o tema</h2>
      <select id="team-select">
        <option value="verde">Equipe Verde</option>
        <option value="vermelha">Equipe Vermelha</option>
        <option value="amarela">Equipe Amarela</option>
        <option value="azul">Equipe Azul</option>
      </select><br><br>
      <button data-theme="seguranca">Segurança</button>
      <button data-theme="qualidade">Qualidade</button>
      <button data-theme="meio_ambiente">Meio Ambiente</button><br>
      <button id="reset-scores" style="background:#ffdcdc;">🔄 Zerar perguntas e ajudas</button>
      <div class="ranking">
  <h3>Ranking:</h3>
  <ul id="ranking-list"></ul>
</div>
<div id="campeao-box"
     style="
     display:none;
     margin-top:20px;
     text-align:center;
     border:4px solid #d4af37;
     border-radius:15px;
     padding:20px;
     background:#fff8dc;">

  <h2 style="
      margin:0;
      color:#d4af37;">
    🏆 CAMPEÃ DO DESAFIO DO CONHECIMENTO
  </h2>

  <h1 id="campeao-texto"
      style="
      margin-top:15px;
      color:#b8860b;
      font-size:32px;">
  </h1>

</div><div id="status-jogo" style="margin-top:20px;">
  <h3 id="titulo-rodada">Rodada 1</h3>
  <p id="contador-rodada">0 / 40 perguntas</p>
</div>

</div> <!-- fecha start-screen -->

<div id="quiz" style="display:none">
  <h3 id="timer" style="text-align:center; color:#d32f2f;">
    ⏱️ Tempo: 20s
  </h3>
<button id="start-timer-btn"
style="display:none;">
  ▶️ Iniciar Tempo
</button>

  <div id="question-container"></div>

  <div class="ajudas">
        <button id="ajuda-cartas">🃏 Ajuda com Cartas</button>
        <button id="ajuda-time">🤝 Ajuda do time</button>
        <button id="ajuda-pular">⏭️ Pular pergunta</button>
      </div>
      <div id="card-choices">
        <h4>Escolha uma carta:</h4>
        <button class="card-btn" data-effect="0"><img src="imagens/damaaa.png" alt="Dama" class="card-img"></button>
        <button class="card-btn" data-effect="1"><img src="imagens/VALETEEE.png" alt="Valete" class="card-img"></button>
        <button class="card-btn" data-effect="2"><img src="imagens/reei..png" alt="Rei" class="card-img"></button>
        <button class="card-btn" data-effect="3"><img src="imagens/As.png" alt="Ás" class="card-img"></button>
      </div>
      <button id="next-btn" style="display:none">Próxima</button>

</div>

</div> <!-- fecha app -->
  <script src="perguntas.js"></script>
  <script src="quiz.js"></script>
<audio id="beep-sound">
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
</audio>
</body>
</html>
